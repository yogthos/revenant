### Model
# Qwen2.5-32B dense — proven architecture for style transfer.
# Dense models respond linearly to LoRA scaling (unlike MoE which goes
# incoherent above scale 1.5). This allows stronger style override.
model_name_or_path: Qwen/Qwen2.5-32B
trust_remote_code: true

### Method
stage: sft
do_train: true
finetuning_type: lora
lora_target: all
# Rank 256 with alpha 512 (2:1 ratio).
# Baked-in scale = alpha/rank = 2.0. Runtime scale adds on top.
# Dense architecture handles this without incoherence.
# No rsLoRA needed — standard LoRA scaling works well on dense models.
lora_rank: 256
lora_alpha: 512
lora_dropout: 0.1

# NEFTune: prevents memorization, forces generalized style patterns.
neftune_noise_alpha: 5.0

### Dataset
dataset: russell_sft
template: qwen
cutoff_len: 2048
packing: true
overwrite_cache: true
preprocessing_num_workers: 1

### Output
output_dir: saves/Qwen2.5-32B/lora/russell
logging_steps: 10
save_steps: 200
plot_loss: true
overwrite_output_dir: true

### Training
# Dataset size: see the row counts printed by filter_training_data.py
# Effective batch size: 1 * 16 = 16 (single GPU)
# Steps per epoch: train rows / 16
per_device_train_batch_size: 1
gradient_accumulation_steps: 16
learning_rate: 1.0e-4
num_train_epochs: 3.0
lr_scheduler_type: cosine
warmup_ratio: 0.05
bf16: true
max_grad_norm: 0.3

### Evaluation
# val.jsonl holds out whole source paragraphs (filter_training_data.py).
# A random split would share outputs with train and mean nothing.
eval_dataset: russell_val
per_device_eval_batch_size: 1
eval_strategy: steps
eval_steps: 200

### Optimization
# QLoRA 4-bit works on dense models (unlike MoE where it breaks experts)
quantization_bit: 4
flash_attn: sdpa
gradient_checkpointing: true
optim: paged_adamw_32bit

